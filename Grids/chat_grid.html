<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid — MulberryAI Chat (Gemini)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=Manrope:wght@200;300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./grid-base.css">
  <style>
    /* body reset pentru standalone preview */
    html, body { height: 100%; margin: 0; background: #eef2ff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { padding: 0; box-sizing: border-box; }
    /* Standalone: gm-overlay fără position:fixed, ocupă tot viewport-ul */
    .gm-overlay {
      position: relative;
      top: unset; left: unset; right: unset; bottom: unset;
      z-index: unset;
      height: 100vh;
      width: 100%;
    }
    .gm-body { height: 0; flex: 1; }
  </style>
</head>
<body>

<!-- CONȚINUT .gm-overlay EXTRAS DIN mulberry_app.html — convertit în pagină standalone -->
<div class="gm-overlay" id="gm-overlay">
  <!-- Top navigation -->
  <div class="gm-topnav">
    <button class="gm-back-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <div class="gm-nav-brand">
      <svg class="gm-nav-star" viewBox="0 0 24 24">
        <defs><linearGradient id="gm-nav-g" x1="0" y1="1" x2="0.7" y2="0"><stop offset="0%" stop-color="#FBBC04"/><stop offset="40%" stop-color="#EA4335"/><stop offset="100%" stop-color="#4285F4"/></linearGradient></defs>
        <path fill="url(#gm-nav-g)" d="M12 2.5C12 2.5 13.6 8.6 18 12C13.6 15.4 12 21.5 12 21.5C12 21.5 10.4 15.4 6 12C10.4 8.6 12 2.5 12 2.5Z"/>
        <path fill="url(#gm-nav-g)" opacity=".45" d="M12 6C12 6 15.4 8.2 17 12C15.4 15.8 12 18 12 18C12 18 8.6 15.8 7 12C8.6 8.2 12 6 12 6Z"/>
      </svg>
      MulberryAI
    </div>
  </div>

  <!-- Body: welcome screen OR chat messages -->
  <div class="gm-body" id="gm-body">
    <!-- Welcome (default state) -->
    <div class="gm-welcome-screen" id="gm-welcome-screen">
      <div class="gm-big-greeting" id="gm-big-greeting">Bună ziua,</div>
      <div class="gm-big-sub">Asistentul tău automotive, powered by Gemini</div>
      <div class="gm-welcome-chips">
        <button class="gm-welcome-chip">Verifică ITP</button>
        <button class="gm-welcome-chip">Status asigurare</button>
        <button class="gm-welcome-chip">Analiză vehicul</button>
        <button class="gm-welcome-chip">Programare service</button>
      </div>
    </div>
    <!-- Chat messages (shown after first send) -->
    <div class="gm-messages" id="gm-messages"></div>
  </div>

  <!-- Fixed input bar -->
  <div class="gm-input-area">
    <div class="gm-input-pill">
      <label class="gm-add-btn" title="Adaugă poză" style="cursor:pointer">
        <input type="file" accept="image/*" style="display:none">
        +
      </label>
      <input type="text" class="gm-pill-input" id="gm-input" placeholder="Întreabă MulberryAI...">
      <div class="gm-input-right">
        <span class="gm-model-badge">✦ Gemini</span>
        <button class="gm-pill-send" title="Trimite">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div class="gm-input-disclaimer">MulberryAI poate greși. Verifică informațiile importante.</div>
  </div>
</div>

</body>
</html>
