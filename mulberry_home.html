<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mulberry</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --yellow:  #F5C21A;
  --maroon:  #2C0E12;
  --dark:    #1C1C1E;
  --white:   #FFFFFF;
  --muted:   rgba(28,28,30,0.42);
  --green:   #34C759;
  --red:     #FF3B30;
  --shadow:  0 2px 20px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
  --radius:  22px;
  --pad:     18px;
}

html { height: 100%; }
body {
  font-family: 'Manrope', -apple-system, sans-serif;
  background: var(--yellow);
  color: var(--dark);
  min-height: 100vh;
  padding-bottom: 96px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── decorative orbs (auth-inspired) ── */
.orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.orb-a {
  width: 320px; height: 320px;
  top: -140px; right: -100px;
  background: rgba(255,255,255,0.22);
}
.orb-b {
  width: 180px; height: 180px;
  bottom: 110px; left: -70px;
  background: rgba(255,255,255,0.13);
}
.orb-c {
  width: 80px; height: 80px;
  top: 240px; left: 28px;
  background: rgba(255,255,255,0.1);
}

.shell { position: relative; z-index: 1; }

/* ── TOPBAR ── */
.topbar {
  padding: max(20px, env(safe-area-inset-top)) var(--pad) 8px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.tb-time {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: rgba(28,28,30,0.45);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.tb-greeting {
  font-size: clamp(26px, 7vw, 34px);
  font-weight: 800;
  color: rgba(28,28,30,0.55);
  letter-spacing: -0.04em;
  line-height: 1.05;
}
.tb-name {
  font-size: clamp(26px, 7vw, 34px);
  font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.04em;
  line-height: 1.05;
}
.tb-av {
  width: 40px; height: 40px;
  background: var(--dark);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  color: var(--yellow);
  flex-shrink: 0;
  margin-top: 6px;
  letter-spacing: 0.04em;
}

/* ── NFC / YELLOWCARD ── */
.nfc-wrap { padding: 16px var(--pad) 0; }
.nfc-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
  -webkit-tap-highlight-color: transparent;
}
.nfc-card:active { transform: scale(0.98); }
.nfc-left { display: flex; align-items: center; gap: 14px; }
.nfc-icon {
  width: 44px; height: 44px;
  background: var(--dark);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: var(--yellow);
  flex-shrink: 0;
}
.nfc-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px; font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.nfc-plate {
  font-size: 15px; font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.2px;
  margin-bottom: 2px;
}
.nfc-sub {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.nfc-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.verified-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(52,199,89,0.1);
  color: #1E8E3E;
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 100px;
  font-family: 'DM Mono', monospace;
}
.verified-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

/* ── SECTION HEADER ── */
.section-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px var(--pad) 12px;
}
.sh-title {
  font-size: 19px; font-weight: 800;
  color: var(--dark); letter-spacing: -0.3px;
}
.sh-link {
  font-family: 'DM Mono', monospace;
  font-size: 11px; font-weight: 500;
  color: rgba(28,28,30,0.4);
  letter-spacing: 0.04em; cursor: pointer;
  text-transform: uppercase;
}

/* ── SERVICE CARDS ── */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 var(--pad);
}
.card {
  border-radius: var(--radius);
  padding: 16px 15px 15px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  min-height: 152px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--shadow);
  -webkit-tap-highlight-color: transparent;
  position: relative; overflow: hidden;
}
.card:active { transform: scale(0.96); box-shadow: none; }
.card-dark { background: var(--dark); }
.card-white { background: var(--white); }

/* subtle inner orb on dark card */
.card-dark::after {
  content: '';
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  top: -30px; right: -30px;
  pointer-events: none;
}

.card-top { display: flex; align-items: flex-start; justify-content: space-between; }
.ci {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.ci-dk  { background: rgba(255,255,255,0.1);  color: rgba(255,255,255,0.9); }
.ci-yl  { background: var(--yellow);           color: var(--maroon); }
.ci-lt  { background: rgba(0,0,0,0.06);        color: var(--dark); }

.arr {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.arr-dk { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); }
.arr-lt { background: rgba(0,0,0,0.05);       color: var(--muted); }

.c-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 3px;
}
.lbl-dk { color: rgba(255,255,255,0.3); }
.lbl-lt { color: var(--muted); }

.c-title {
  font-size: clamp(16px, 4.3vw, 19px);
  font-weight: 800; letter-spacing: -0.3px;
  line-height: 1.1;
}
.t-dk { color: var(--white); }
.t-lt { color: var(--dark); }

.c-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 100px;
  font-size: 11px; font-weight: 700;
  margin-top: 10px;
  font-family: 'DM Mono', monospace;
}
.b-glow    { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.82); }
.b-red     { background: var(--red);             color: white; }
.b-neutral { background: rgba(0,0,0,0.06);       color: rgba(28,28,30,0.65); }

/* ── ACTIVITY CARD ── */
.activity-wrap { padding: 0 var(--pad); }
.wide-card {
  border-radius: var(--radius);
  padding: 18px 18px 16px;
  background: var(--white);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
  -webkit-tap-highlight-color: transparent;
}
.wide-card:active { transform: scale(0.99); }
.ac-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.ac-live {
  display: flex; align-items: center; gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 10px; font-weight: 500;
  color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase;
}
.live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
.ac-seg {
  display: flex; gap: 2px;
  background: rgba(0,0,0,0.05); border-radius: 8px; padding: 2px;
}
.ac-btn {
  padding: 5px 12px; border-radius: 6px;
  border: none; background: none;
  font-size: 12px; font-weight: 700;
  color: var(--muted); cursor: pointer;
  font-family: 'Manrope', sans-serif;
  transition: all .15s;
}
.ac-btn.on {
  background: white; color: var(--dark);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.ac-val {
  font-size: clamp(28px, 7.5vw, 36px);
  font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.05em;
  margin-bottom: 16px;
}
.ac-val em {
  font-style: normal;
  font-size: 14px; font-weight: 500;
  color: var(--muted); letter-spacing: 0;
  margin-left: 5px;
}
.bars {
  display: flex; align-items: flex-end; gap: 4px;
  height: 54px;
}
.b { border-radius: 4px 4px 0 0; flex: 1; min-width: 0; transform-origin: bottom; }
.b.lo { background: #E5E5EA; }
.b.md { background: #C7C7CC; }
.b.hi { background: var(--dark); }
.b.yl { background: var(--yellow); border: 1.5px solid rgba(0,0,0,0.08); }

/* bar entrance animation */
.b { animation: barIn .5s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes barIn {
  from { transform: scaleY(0); opacity: 0; }
  to   { transform: scaleY(1); opacity: 1; }
}
.bars .b:nth-child(1)  { animation-delay: .04s }
.bars .b:nth-child(2)  { animation-delay: .08s }
.bars .b:nth-child(3)  { animation-delay: .12s }
.bars .b:nth-child(4)  { animation-delay: .16s }
.bars .b:nth-child(5)  { animation-delay: .20s }
.bars .b:nth-child(6)  { animation-delay: .24s }
.bars .b:nth-child(7)  { animation-delay: .28s }
.bars .b:nth-child(8)  { animation-delay: .32s }
.bars .b:nth-child(9)  { animation-delay: .36s }
.bars .b:nth-child(10) { animation-delay: .40s }
.bars .b:nth-child(11) { animation-delay: .44s }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.92);
  border-top: 0.5px solid rgba(0,0,0,0.07);
  padding: 10px 0 max(20px, env(safe-area-inset-bottom));
  display: flex;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 100;
}
.ni {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ni-pill {
  padding: 5px 18px; border-radius: 100px;
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.ni-pill.on  { background: var(--yellow); color: var(--maroon); }
.ni-pill.off { color: #8E8E93; }
.ni-lbl { font-size: 10px; font-weight: 600; color: #8E8E93; }
.ni-lbl.on { color: var(--dark); font-weight: 700; }
</style>
</head>
<body>

<!-- auth-inspired soft orbs on yellow bg -->
<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>

<div class="shell">

  <!-- HEADER -->
  <div class="topbar">
    <div>
      <div class="tb-time" id="js-time"></div>
      <div class="tb-greeting" id="js-greeting"></div>
      <div class="tb-name">Stefan L.</div>
    </div>
    <div class="tb-av">SL</div>
  </div>

  <!-- YELLOWCARD -->
  <div class="nfc-wrap">
    <div class="nfc-card">
      <div class="nfc-left">
        <div class="nfc-icon"><i class="ti ti-id-badge"></i></div>
        <div>
          <div class="nfc-label">YellowCard</div>
          <div class="nfc-plate">B-12-MLB</div>
          <div class="nfc-sub">Audi A4 · 2018 · A7K2‑9F3X</div>
        </div>
      </div>
      <div class="nfc-right">
        <div class="verified-pill"><div class="verified-dot"></div>Verificat</div>
      </div>
    </div>
  </div>

  <!-- SERVICII -->
  <div class="section-hdr">
    <span class="sh-title">Servicii</span>
    <span class="sh-link">Vezi tot</span>
  </div>

  <div class="cards-grid">

    <div class="card card-dark">
      <div class="card-top">
        <div class="ci ci-dk"><i class="ti ti-sparkles"></i></div>
        <div class="arr arr-dk"><i class="ti ti-arrow-up-right"></i></div>
      </div>
      <div>
        <div class="c-lbl lbl-dk">Produs</div>
        <div class="c-title t-dk">Mulberry<br>AI</div>
        <div class="c-badge b-glow"><i class="ti ti-bolt" style="font-size:10px"></i> Activ</div>
      </div>
    </div>

    <div class="card card-white">
      <div class="card-top">
        <div class="ci ci-yl"><i class="ti ti-bell"></i></div>
        <div class="arr arr-lt"><i class="ti ti-arrow-up-right"></i></div>
      </div>
      <div>
        <div class="c-lbl lbl-lt">Produs</div>
        <div class="c-title t-lt">Mulberry<br>EXO</div>
        <div class="c-badge b-red"><i class="ti ti-alert-circle" style="font-size:10px"></i> 2 alerte</div>
      </div>
    </div>

    <div class="card card-white">
      <div class="card-top">
        <div class="ci ci-lt"><i class="ti ti-folder"></i></div>
        <div class="arr arr-lt"><i class="ti ti-arrow-up-right"></i></div>
      </div>
      <div>
        <div class="c-lbl lbl-lt">Produs</div>
        <div class="c-title t-lt">Mulberry<br>HUB</div>
        <div class="c-badge b-neutral"><i class="ti ti-files" style="font-size:10px"></i> 8 acte</div>
      </div>
    </div>

    <div class="card card-white">
      <div class="card-top">
        <div class="ci ci-yl"><i class="ti ti-building-store"></i></div>
        <div class="arr arr-lt"><i class="ti ti-arrow-up-right"></i></div>
      </div>
      <div>
        <div class="c-lbl lbl-lt">Produs</div>
        <div class="c-title t-lt">Market<br>place</div>
        <div class="c-badge b-neutral"><i class="ti ti-tag" style="font-size:10px"></i> 12 oferte</div>
      </div>
    </div>

  </div>

  <!-- ACTIVITATE -->
  <div class="section-hdr">
    <span class="sh-title">Activitate</span>
    <span class="sh-link">Istoric</span>
  </div>

  <div class="activity-wrap">
    <div class="wide-card">
      <div class="ac-top">
        <div class="ac-live"><div class="live-dot"></div>Live</div>
        <div class="ac-seg">
          <button class="ac-btn on">Oferte</button>
          <button class="ac-btn">Zile</button>
        </div>
      </div>
      <div class="ac-val">137 <em>acțiuni</em></div>
      <div class="bars">
        <div class="b lo" style="height:38%"></div>
        <div class="b lo" style="height:52%"></div>
        <div class="b md" style="height:44%"></div>
        <div class="b lo" style="height:68%"></div>
        <div class="b md" style="height:48%"></div>
        <div class="b lo" style="height:58%"></div>
        <div class="b md" style="height:42%"></div>
        <div class="b hi" style="height:100%"></div>
        <div class="b yl" style="height:72%"></div>
        <div class="b lo" style="height:55%"></div>
        <div class="b lo" style="height:38%"></div>
      </div>
    </div>
  </div>

</div><!-- /shell -->

<nav class="bottom-nav">
  <div class="ni"><div class="ni-pill on"><i class="ti ti-home"></i></div><span class="ni-lbl on">Acasă</span></div>
  <div class="ni"><div class="ni-pill off"><i class="ti ti-building-store"></i></div><span class="ni-lbl">Oferte</span></div>
  <div class="ni"><div class="ni-pill off"><i class="ti ti-id-badge"></i></div><span class="ni-lbl">Card</span></div>
  <div class="ni"><div class="ni-pill off"><i class="ti ti-user"></i></div><span class="ni-lbl">Cont</span></div>
</nav>

<script>
function tick() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');

  document.getElementById('js-time').textContent =
    `${String(h).padStart(2,'0')}:${m}`;

  document.getElementById('js-greeting').textContent =
    h >= 5  && h < 12 ? 'Bună dimineața,' :
    h >= 12 && h < 18 ? 'Bună ziua,'      :
    h >= 18 && h < 22 ? 'Bună seara,'     :
                        'Bună noaptea,';
}

tick();
setInterval(tick, 30000);

document.querySelectorAll('.ac-btn').forEach(btn => {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.ac-btn').forEach(b => b.classList.remove('on'));
    this.classList.add('on');
  });
});
</script>
</body>
</html>
