<script>
const API = (window.Config && window.Config.apiBaseUrl) || 'http://46.225.100.151:8080';
let currentUser = null;

function saveSession(d) { localStorage.setItem('mlbr_s', JSON.stringify(d)); currentUser = d; }
function loadSession() {
  try { const r = localStorage.getItem('mlbr_s'); if(r){ currentUser=JSON.parse(r); return currentUser; } } catch(e){}
  return null;
}
function clearSession() { localStorage.removeItem('mlbr_s'); currentUser = null; sb.auth.signOut(); }


let _tt;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(_tt); _tt = setTimeout(() => el.className='toast', 2800);
}

async function apiPost(path, body) {
  const r = await fetch(API + path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || 'Eroare server');
  return d;
}
async function apiGet(path) {
  const headers = currentUser?.token ? {'Authorization':'Bearer '+currentUser.token} : {};
  const r = await fetch(API + path, { headers, signal: AbortSignal.timeout(5000) });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function checkHealth() {
  const dot = document.getElementById('tb-dot');
  const lbl = document.getElementById('tb-lbl');
  try {
    await fetch(API + '/health', { signal: AbortSignal.timeout(5000) });
    dot.className = 'tb-dot on'; lbl.textContent = 'online';
    const t = new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('at-health-time').textContent = t;
    document.getElementById('at-api').textContent = API;
    document.getElementById('set-api-url').textContent = API;
    document.getElementById('set-health-lbl').textContent = '● online';
    document.getElementById('set-health-lbl').style.color = 'var(--green)';
  } catch(e) {
    dot.className = 'tb-dot off'; lbl.textContent = 'offline';
    document.getElementById('set-health-lbl').textContent = '● offline';
    document.getElementById('set-health-lbl').style.color = 'var(--red)';
  }
}

async function loadStats() {
  try {
    const s = await apiGet('/api/stats');
    document.getElementById('st-drivers').textContent  = s.drivers  ?? '—';
    document.getElementById('st-partners').textContent = s.partners ?? '—';
    document.getElementById('st-vehicles').textContent = s.vehicles ?? '—';
    document.getElementById('st-offers').textContent   = s.offers   ?? '—';
  } catch(e) {}
}

(async () => {

let afCurrentEmail = '';
let afResendInterval = null;

function afGoToStep(n) {
  document.querySelectorAll('.af-step').forEach(s => s.classList.remove('active'));
  document.getElementById(`af-step-${n}`).classList.add('active');
  document.querySelectorAll('.af-dot').forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i + 1 < n) d.classList.add('done');
    else if (i + 1 === n) d.classList.add('active');
  });
}

function afSwitchTab(btn) {
  document.querySelectorAll('.af-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function afSignInWithGoogle() {
  sessionStorage.setItem('mlbr_oauth', '1');
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: 'https://mulberry.autos/mulberry_app.html',
      queryParams: { prompt: 'select_account', access_type: 'online' }
    }
  });
  if (error) { sessionStorage.removeItem('mlbr_oauth'); afShowAlert('af-alert-1', error.message); }
}

async function afSendOTP() {
  const email = (document.getElementById('af-email').value || '').trim();
  if (!email || !email.includes('@')) return afShowAlert('af-alert-1', 'Introdu un email valid.');
  afCurrentEmail = email;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  if (error) return afShowAlert('af-alert-1', error.message);
  document.getElementById('af-email-display').textContent = email;
  afGoToStep(2);
  afSetupOTP();
  afStartResendTimer();
}

async function afVerifyOTP() {
  const token = Array.from({length:6}, (_, i) => document.getElementById(`af-otp-${i}`).value).join('');
  if (token.length !== 6) return afShowAlert('af-alert-2', 'Introdu toate cele 6 cifre.');
  const { data, error } = await sb.auth.verifyOtp({ email: afCurrentEmail, token, type: 'email' });
  if (error) return afShowAlert('af-alert-2', 'Cod incorect sau expirat. Încearcă din nou.');
  if (data?.session) {
    const u = data.session.user;
    saveSession({ email: u.email, name: u.user_metadata?.full_name || null, avatar: u.user_metadata?.avatar_url || null });
    enterApp();
  } else { afGoToStep(3); }
}

async function afResendOTP() {
  await sb.auth.signInWithOtp({ email: afCurrentEmail, options: { shouldCreateUser: true } });
  afStartResendTimer();
}

function afStartResendTimer() {
  let s = 60;
  const btn = document.getElementById('af-resend-btn');
  const timer = document.getElementById('af-resend-timer');
  btn.disabled = true;
  if (afResendInterval) clearInterval(afResendInterval);
  afResendInterval = setInterval(() => {
    s--;
    timer.textContent = ` (${s}s)`;
    if (s <= 0) { clearInterval(afResendInterval); btn.disabled = false; timer.textContent = ''; }
  }, 1000);
}

function afSetupOTP() {
