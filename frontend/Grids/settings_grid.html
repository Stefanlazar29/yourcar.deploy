<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=Manrope:wght@200;300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./grid-base.css">
  <style>
    /* body reset pentru standalone preview */
    html, body { height: 100%; margin: 0; background: #f0f0ee; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { padding: 28px 32px; box-sizing: border-box; }
  </style>
</head>
<body>

<!-- CONȚINUT PANEL EXTRAS DIN mulberry_app.html — interior-ul div#panel-settings -->
<div class="ph">
  <div class="ph-eyebrow">Configurare</div>
  <div class="ph-title">Setări</div>
  <div class="ph-sub">Cont, securitate și configurare aplicație</div>
</div>

<div class="set-section">
  <div class="set-hdr">Profil</div>
  <div class="set-row" style="cursor:default">
    <div class="set-row-ico" style="background:var(--yellow)">
      <div style="font-size:14px;font-weight:800;color:var(--wine)" id="set-init">M</div>
    </div>
    <div class="set-row-info">
      <div class="set-row-lbl" id="set-uname">—</div>
      <div class="set-row-desc" id="set-uemail">—</div>
    </div>
    <div class="set-row-end" style="color:var(--wine);font-size:10px;font-weight:700;background:var(--wine-dim);padding:3px 10px;border-radius:20px">ACTIV</div>
  </div>
</div>

<div class="set-section">
  <div class="set-hdr">Conexiune</div>
  <div class="set-row" style="cursor:default">
    <div class="set-row-ico"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <div class="set-row-info">
      <div class="set-row-lbl">Backend API</div>
      <div class="set-row-desc">Mulberry API Server</div>
    </div>
    <div class="set-row-end" id="set-health-lbl">—</div>
  </div>
  <div class="set-api" id="set-api-url">—</div>
</div>

<div class="set-section">
  <div class="set-hdr">Securitate</div>
  <div class="set-row">
    <div class="set-row-ico"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
    <div class="set-row-info">
      <div class="set-row-lbl">Schimbă parola</div>
      <div class="set-row-desc">Actualizează credențialele</div>
    </div>
    <div class="set-row-end"><svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
  </div>
  <div class="set-row">
    <div class="set-row-ico"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg></div>
    <div class="set-row-info">
      <div class="set-row-lbl">YellowCard ID</div>
      <div class="set-row-desc" id="set-cardid">—</div>
    </div>
    <div class="set-row-end" style="color:var(--wine)">MLBR</div>
  </div>
</div>

<div class="set-section">
  <div class="set-hdr">Sesiune</div>
  <div class="set-row">
    <div class="set-row-ico" style="background:rgba(220,38,38,.1)">
      <svg viewBox="0 0 24 24" stroke="var(--red)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <div class="set-row-info">
      <div class="set-row-lbl" style="color:var(--red)">Deconectare</div>
      <div class="set-row-desc">Ieși din contul curent</div>
    </div>
    <div class="set-row-end"><svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
  </div>
</div>

</body>
</html>
