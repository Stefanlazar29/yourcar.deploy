<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulberry — App</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --yellow:#ECFF54;
  --wine:#2C0E12;
  --wine-dim:rgba(44,14,18,.09);
  --black:#1a1a1a;
  --white:#FFFFFF;
  --gray:#F5F5F3;
  --b1:rgba(0,0,0,.07);
  --b2:rgba(0,0,0,.12);
  --b3:rgba(0,0,0,.20);
  --dim1:rgba(0,0,0,.65);
  --dim2:rgba(0,0,0,.45);
  --dim3:rgba(0,0,0,.28);
  --red:#dc2626;
  --green:#16a34a;
  --font:'TT Firs Neue','Plus Jakarta Sans',system-ui,sans-serif;
  --font-head:'Manrope','TT Firs Neue',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --sw:268px;--th:62px;--bh:66px;--r:12px;--rl:20px;
}
html,body{height:100%;background:var(--gray);color:var(--black);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* ══ AUTH ══════════════════════════════════════════ */
#auth-screen{
  position:fixed;inset:0;display:flex;z-index:200;
  background:
    radial-gradient(ellipse 20% 88% at -4% 72%, rgba(18,55,255,1) 0%, rgba(10,35,210,.72) 32%, transparent 62%),
    radial-gradient(ellipse 17% 80% at 22% 66%, rgba(255,148,8,.98) 0%, rgba(215,95,5,.62) 36%, transparent 63%),
    radial-gradient(ellipse 5% 76% at 43% 62%, rgba(28,195,155,.92) 0%, rgba(14,145,112,.52) 46%, transparent 68%),
    radial-gradient(ellipse 5% 76% at 57% 62%, rgba(28,195,155,.88) 0%, rgba(14,145,112,.48) 46%, transparent 68%),
    radial-gradient(ellipse 17% 80% at 78% 66%, rgba(255,148,8,.95) 0%, rgba(215,95,5,.58) 36%, transparent 63%),
    radial-gradient(ellipse 20% 88% at 104% 72%, rgba(18,55,255,.96) 0%, rgba(10,35,210,.66) 32%, transparent 62%),
    radial-gradient(ellipse 100% 18% at 50% 100%, rgba(15,35,110,.38) 0%, transparent 70%),
    #000;
}

.auth-left{
  flex:1;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  display:flex;flex-direction:column;padding:48px;
  position:relative;overflow:hidden;
}
.auth-left::before{content:'';position:absolute;top:-120px;right:-120px;width:400px;height:400px;background:radial-gradient(circle,rgba(236,255,84,.07) 0%,transparent 70%);pointer-events:none}
.auth-left::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(236,255,84,.04) 0%,transparent 70%);pointer-events:none}
.al-back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);font-family:var(--font);font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer;transition:all .15s;align-self:flex-start}
.al-back-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.al-back-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;flex-shrink:0}
.al-logo{display:flex;align-items:center;gap:11px;margin-bottom:auto}
.al-wordmark{height:76px;width:auto;display:block}
.al-wordmark{height:36px;width:auto;display:block}
.sb-wordmark{height:28px;width:auto;display:block}
.al-logo-center{flex:1;display:flex;align-items:center;justify-content:center}
.al-logo-full{height:48px;width:auto;filter:invert(1);opacity:.95}
.af-brand-logo{margin-bottom:28px}
.af-login-logo{height:30px;width:auto;mix-blend-mode:screen;opacity:.95}
.al-hero{padding:60px 0 40px;position:relative;z-index:1}
.al-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(236,255,84,.12);border:1px solid rgba(236,255,84,.22);color:var(--yellow);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;margin-bottom:22px;text-transform:uppercase;letter-spacing:.08em}
.al-tag-dot{width:6px;height:6px;border-radius:50%;background:var(--yellow)}
/* ── HEADING FONT ── */
.al-h1,.al-name,.af-title,.af-logo-name,.sb-logo-name,.tb-title,.ph-title,.sc-val,.yc-name,.oc-name{font-family:var(--font-head)}
.al-h1{font-size:clamp(28px,3.5vw,42px);font-weight:900;line-height:1.12;letter-spacing:-.5px;margin-bottom:16px;color:#fff}
.al-h1 em{color:var(--yellow);font-style:normal}
.al-sub{font-size:15px;color:rgba(255,255,255,.6);line-height:1.6;max-width:380px}
.al-features{margin-top:40px;display:flex;flex-direction:column;gap:12px}
.al-feat{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:600;color:rgba(255,255,255,.65)}
.al-feat-ico{width:28px;height:28px;border-radius:8px;background:rgba(236,255,84,.12);border:1px solid rgba(236,255,84,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.al-feat-ico svg{width:13px;height:13px;stroke:var(--yellow);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.al-foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.28)}

.auth-right{
  width:480px;flex-shrink:0;
  background:rgba(8,8,8,0.82);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-left:1px solid rgba(255,255,255,0.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 44px;overflow-y:auto;
}
/* ── AUTH FORM ELEMENTS ── */
.auth-form-panel{width:100%;max-width:380px}
.af-step{display:none}.af-step.active{display:block}
.af-step-indicator{display:flex;align-items:center;gap:6px;margin-bottom:2rem}
.af-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all .2s}
.af-dot.active{background:var(--yellow);width:18px;border-radius:3px}
.af-dot.done{background:rgba(34,197,94,0.6)}
.af-title{font-size:1.5rem;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#fff;font-family:var(--font-head)}
.af-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:1.75rem;line-height:1.6}
.af-sub strong{color:rgba(255,255,255,0.7)}
.af-tabs{display:flex;width:100%;margin-bottom:1.5rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:4px}
.af-tab{flex:1;padding:9px 0;border:none;background:transparent;color:rgba(255,255,255,0.45);font-family:var(--font);font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;transition:all .2s}
.af-tab.active{background:rgba(255,255,255,0.1);color:#fff}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;background:#fff;color:#1a1a1a;border:none;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-bottom:1.25rem}
.btn-google:hover{opacity:.92}
.btn-google svg{width:18px;height:18px;flex-shrink:0}
.af-divider{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem}
.af-divider-line{flex:1;height:1px;background:rgba(255,255,255,0.08)}
.af-divider-text{font-size:12px;color:rgba(255,255,255,0.35)}
.field{margin-bottom:14px;width:100%}
.field label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em}
.field input{width:100%;padding:13px 16px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-family:var(--font);font-size:15px;outline:none;transition:border-color .2s}
.field input:focus{border-color:rgba(236,255,84,0.4)}
.field input::placeholder{color:rgba(255,255,255,0.3)}
.btn-primary{width:100%;padding:13px;background:var(--yellow);color:var(--wine);border:none;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;transition:opacity .15s;margin-bottom:1rem;letter-spacing:.01em}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{width:100%;padding:12px;background:transparent;color:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.1);border-radius:10px;font-family:var(--font);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:rgba(255,255,255,0.25);color:#fff}
.otp-inputs{display:flex;gap:6px;margin-bottom:1.5rem}
.otp-digit{flex:1;height:48px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:8px;font-family:'DM Mono','JetBrains Mono',monospace;font-size:1.1rem;font-weight:500;color:#fff;text-align:center;outline:none;transition:border-color .2s;min-width:0}
.otp-digit:focus{border-color:rgba(236,255,84,0.4)}
.af-resend{text-align:center;margin-top:1rem;font-size:13px;color:rgba(255,255,255,0.45)}
.af-resend-btn{background:none;border:none;color:var(--yellow);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;padding:0}
.af-resend-btn:disabled{color:rgba(255,255,255,0.35);cursor:not-allowed}
.upload-zone{width:100%;border:2px dashed rgba(255,255,255,0.12);border-radius:10px;padding:2.5rem 1.5rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1.25rem;position:relative}
.upload-zone:hover,.upload-zone.drag-over{border-color:rgba(236,255,84,0.4);background:rgba(236,255,84,0.04)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:2rem;margin-bottom:.75rem}
.upload-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:.4rem}
.upload-sub{font-size:12px;color:rgba(255,255,255,0.4);line-height:1.5}
.af-processing{display:none;text-align:center;padding:2rem 0}
.af-processing.active{display:block}
.af-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.af-processing-text{font-size:14px;color:rgba(255,255,255,0.5)}
.af-extracted{display:none}.af-extracted.active{display:block}
.yellowcard{background:linear-gradient(145deg,#f5d020,#f0a500);border-radius:14px;padding:18px 16px;margin-bottom:1.25rem;box-shadow:0 6px 24px rgba(245,165,0,0.25)}
.yellowcard-header{font-size:0.6rem;font-weight:700;letter-spacing:.12em;color:rgba(0,0,0,0.4);text-transform:uppercase;margin-bottom:14px}
.yellowcard-field{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.yellowcard-code{font-size:0.68rem;font-weight:700;color:rgba(0,0,0,0.5);width:30px;flex-shrink:0;font-family:'DM Mono','JetBrains Mono',monospace}
.yellowcard-input{flex:1;background:rgba(255,255,255,0.55);border:1px solid rgba(0,0,0,0.12);border-radius:6px;padding:7px 10px;font-size:0.85rem;color:#111;outline:none;font-family:inherit;transition:background .2s;min-width:0}
.yellowcard-input:focus{background:rgba(255,255,255,0.85)}
.af-check-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:1.25rem}
.af-check-row input[type="checkbox"]{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:var(--yellow);cursor:pointer}
.af-check-label{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.5;cursor:pointer}
.af-alert{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:1rem;display:none}
.af-alert.active{display:block}
.af-alert.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#FCA5A5}
.af-alert.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#86EFAC}
.af-foot{margin-top:1.5rem;text-align:center;font-size:12px;color:rgba(255,255,255,0.3)}
.af-foot a{color:rgba(255,255,255,0.35);text-decoration:none}
.af-foot a:hover{color:rgba(255,255,255,0.6)}
.af-err{font-size:13px;color:var(--red);margin-top:10px;min-height:18px;text-align:center}

@media(max-width:768px){
  #auth-screen{flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}
  .auth-left{
    position:absolute;inset:0;z-index:0;
    display:flex;padding:0;
    background:rgba(0,0,0,.25);
  }
  .auth-left .al-logo,.auth-left .al-hero,.auth-left .al-features,.auth-left .al-foot{display:none}
  .auth-right{
    position:relative;z-index:1;
    width:100%;max-width:420px;
    background:rgba(8,8,8,.52);
    backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:28px;
    padding:36px 28px 32px;
    justify-content:flex-start;
  }
}

/* ══ APP SHELL ═════════════════════════════════════ */
#app-shell{
  position:fixed;inset:0;
  display:grid;
  grid-template-columns:var(--sw) 1fr;
  grid-template-rows:var(--th) 1fr;
  background:#0d0d0e;
}

/* SIDEBAR – black menu */
.sidebar{
  grid-row:1/-1;grid-column:1;
  background:#000;
  display:flex;flex-direction:column;
  padding:18px 12px;overflow-y:auto;
  transition:transform .26s cubic-bezier(.4,0,.2,1);
  z-index:50;
}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 10px 0;margin-bottom:28px}
.sb-logo-mark{width:32px;height:32px;border-radius:8px;overflow:hidden;flex-shrink:0;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.sb-logo-name{font-size:16px;font-weight:800;letter-spacing:-.2px;color:#fff}
.sb-logo-ver{font-size:9px;color:rgba(255,255,255,.3);font-weight:700;text-transform:uppercase;letter-spacing:.1em}

.sb-sep{height:1px;background:rgba(255,255,255,.1);margin:10px 10px 14px}
.sb-label{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.1em;padding:0 12px;margin-bottom:4px;font-family:'Urbanist',sans-serif}

.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  cursor:pointer;color:rgba(255,255,255,.6);font-size:13.5px;font-weight:600;
  transition:all .15s;border:none;background:transparent;width:100%;text-align:left;
  margin-bottom:1px;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(236,255,84,.12);color:var(--yellow)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;background:var(--yellow);margin-left:-12px}
.ni-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.08);transition:background .15s}
.nav-item.active .ni-icon{background:rgba(236,255,84,.15)}
.ni-icon svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ni-badge{margin-left:auto;font-size:10px;font-weight:700;background:rgba(236,255,84,.12);color:var(--yellow);padding:2px 7px;border-radius:10px}

.sb-spacer{flex:1}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:all .18s;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);margin-bottom:4px}
.sb-user:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14)}
.sb-user.confirm-logout{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.28)}
.sb-user.confirm-logout .sb-logout svg{stroke:#ef4444}
.sb-user.confirm-logout .sb-uname::after{content:' · Confirmi?';color:rgba(239,68,68,.8);font-weight:400}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--wine);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.sb-uinfo{flex:1;min-width:0}
.sb-uname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-family:'Urbanist',sans-serif}
.sb-uemail{font-size:11px;color:rgba(255,255,255,.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-logout svg{width:15px;height:15px;stroke:rgba(255,255,255,.38);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* TOPBAR – black */
.topbar{grid-column:2;grid-row:1;background:#0d0d0e;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 20px;gap:12px}
.tb-hamburger{display:none;width:40px;height:40px;background:transparent;border:none;border-radius:10px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.tb-hamburger img{width:30px;height:30px;border-radius:8px;object-fit:cover;display:block}
/* Logo button in topbar (desktop) */
.tb-logo-btn{display:flex;align-items:center;background:transparent;border:none;cursor:pointer;padding:6px 10px;border-radius:10px;transition:background .15s;flex-shrink:0}
.tb-logo-btn:hover{background:rgba(255,255,255,.08)}
.tb-wordmark-top{height:20px;width:auto;display:block;filter:brightness(0) invert(1)}
/* Gemini AI bar */
.tb-ai-bar{flex:1;max-width:480px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:7px 12px;cursor:pointer;transition:background .15s;min-width:0}
.tb-ai-bar:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.18)}
.tb-ai-star{width:18px;height:18px;flex-shrink:0}
.tb-ai-placeholder{flex:1;font-size:12.5px;color:rgba(255,255,255,.42);font-family:'Inter',sans-serif;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-ai-powered{font-size:10px;font-weight:500;color:rgba(255,255,255,.22);white-space:nowrap;font-family:'Inter',sans-serif}
.tb-ai-kbd{font-size:10px;font-weight:600;color:rgba(255,255,255,.22);background:rgba(255,255,255,.07);padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;flex-shrink:0}
/* Profile corner */
.tb-profile{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.tb-status{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.45)}
.tb-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .3s;flex-shrink:0}
